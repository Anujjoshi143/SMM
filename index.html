body{background:radial-gradient(circle at top,#34145f 0%,#141033 36%,#050816 100%);overflow-x:hidden}.wrap{position:relative;z-index:1}.top{background:rgba(10,15,42,.72);border-bottom:1px solid rgba(255,255,255,.08)}.logo{background:linear-gradient(135deg,#7c3aed,#ff2e9e,#ff9f43);box-shadow:0 0 32px rgba(168,85,247,.4)}.brand{letter-spacing:.3px}.btn{background:linear-gradient(135deg,#7c3aed,#a855f7,#ff2e9e);box-shadow:0 12px 30px rgba(168,85,247,.28)}.btn.green{background:linear-gradient(135deg,#16a34a,#22c55e)}.hero{padding-top:34px}.heroBox,.card,.adminCard{background:linear-gradient(180deg,rgba(26,23,64,.86),rgba(10,15,42,.82));backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.13)}.heroBox{box-shadow:0 28px 90px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}.heroBox:after{background:radial-gradient(circle,rgba(255,46,158,.22),transparent 65%)}.tag{background:rgba(255,46,158,.12);border-color:rgba(255,46,158,.25);color:#ffd5f0}.hero h1{letter-spacing:-1.8px}.hero h1 .grad,.gradText{background:linear-gradient(135deg,#ff4dcd,#ffaa33);-webkit-background-clip:text;background-clip:text;color:transparent}.trust-orb{width:190px;height:190px;border-radius:46px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#ff2e9e,#ff9f43);font-size:54px;font-weight:950;box-shadow:0 30px 70px rgba(168,85,247,.42);animation:floatTrust 5s ease-in-out infinite}.heroLogoText{text-align:center;font-size:22px;font-weight:950}.heroSub{text-align:center;color:var(--muted);margin-top:7px}.platform-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 8px}.platform-card{min-height:132px;border-radius:26px;padding:18px;color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;box-shadow:0 16px 40px rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.15);transition:.25s}.platform-card:hover,.service:hover{transform:translateY(-5px) scale(1.01)}.platform-card i{font-size:34px}.platform-card b{font-size:16px}.platform-card small{opacity:.85}.platform-instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}.platform-youtube{background:linear-gradient(135deg,#e52d27,#b31217)}.platform-facebook{background:linear-gradient(135deg,#1877f2,#0e5bc9)}.platform-other{background:linear-gradient(135deg,#2a2f5c,#7c3aed)}.service{overflow:hidden;position:relative}.service:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,#7c3aed,#ff2e9e,#ff9f43)}.service .cat{color:#d8b4fe}.service.service-instagram:before{background:linear-gradient(90deg,#833ab4,#fd1d1d,#fcb045)}.service.service-youtube:before{background:linear-gradient(90deg,#ff0033,#ff7070)}.service.service-facebook:before{background:linear-gradient(90deg,#1877f2,#74b7ff)}.service.service-telegram:before{background:linear-gradient(90deg,#229ed9,#62d4ff)}.service.service-tiktok:before{background:linear-gradient(90deg,#25f4ee,#fe2c55)}.service.service-discord:before{background:linear-gradient(90deg,#5865f2,#a3a9ff)}.floating-socials{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}.floating-icon{position:fixed;font-size:4rem;opacity:.095;filter:drop-shadow(0 10px 20px rgba(0,0,0,.3));animation:floatAround 18s infinite ease-in-out}.floating-icon:nth-child(1){top:8%;left:3%;color:#ff2e9e;animation-duration:20s}.floating-icon:nth-child(2){top:12%;right:4%;color:#ff3b3b;animation-duration:24s}.floating-icon:nth-child(3){top:34%;right:7%;color:#1877f2;animation-duration:22s}.floating-icon:nth-child(4){bottom:26%;left:5%;color:#fff;animation-duration:26s}.floating-icon:nth-child(5){top:67%;left:14%;color:#25f4ee;animation-duration:21s}.floating-icon:nth-child(6){top:18%;right:22%;color:#2aaeea;animation-duration:23s}.floating-icon:nth-child(7){bottom:38%;right:24%;color:#5865f2;animation-duration:28s}@keyframes floatAround{0%,100%{transform:translate(0,0) rotate(0) scale(1)}33%{transform:translate(30px,-25px) rotate(5deg) scale(1.08)}66%{transform:translate(-20px,20px) rotate(-3deg) scale(.96)}}@keyframes floatTrust{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@media(max-width:900px){.platform-strip{grid-template-columns:repeat(2,1fr)}.trust-orb{width:140px;height:140px;font-size:42px}.floating-icon{font-size:2.8rem}}

/* ============ BLOG SYSTEM ============ */
.platform-strip{grid-template-columns:repeat(5,1fr)}.platform-blog{background:linear-gradient(135deg,#7c3aed,#3b82f6)}
.orbitIcon.blg{left:calc(50% - 27px);top:4px;background:linear-gradient(135deg,#7c3aed,#ff9f43);animation-delay:2.2s}
.blogWrap{padding-top:6px}
.blogHeroCard{background:linear-gradient(135deg,rgba(124,58,237,.28),rgba(255,46,158,.16),rgba(255,159,67,.10));border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:34px;position:relative;overflow:hidden;margin-bottom:22px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.blogHeroCard:after{content:"";position:absolute;right:-90px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,46,158,.18),transparent 65%)}
.blogHeroTitle{font-size:clamp(28px,4vw,46px);line-height:1.12;margin:12px 0;letter-spacing:-1px}
.chipRow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#dbe8fb;font-weight:800;font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{background:rgba(255,255,255,.10)}
.chip.active{background:linear-gradient(135deg,#7c3aed,#ff2e9e);border-color:transparent;color:#fff}
.searchBar{display:flex;gap:10px;align-items:center;background:#081426;border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-width:440px}
.searchBar i{color:var(--muted)}
.searchBar input{border:0;background:transparent;padding:0;box-shadow:none;outline:none}
.searchBar input:focus{border:0;box-shadow:none}
.postGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.postCard{display:flex;flex-direction:column;gap:11px;cursor:pointer;transition:.2s}
.postCard:hover{transform:translateY(-4px);border-color:rgba(139,92,246,.5)}
.postCover{height:120px;border-radius:18px;display:grid;place-items:center;font-size:44px;border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden}
.postCover:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,58,237,.28),rgba(255,46,158,.12))}
.postCover span{position:relative;z-index:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.postCat{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#d8b4fe}
.postCard h3{margin:0;font-size:17px;line-height:1.45}
.postEx{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6;flex:1}
.postMeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px}
.postMeta .dot{width:4px;height:4px;border-radius:50%;background:var(--muted)}
.readMore{color:#baffee;font-weight:900;font-size:13px}
.postPage{max-width:840px;margin:0 auto}
.postBack{display:inline-flex;gap:8px;align-items:center;color:#baffee;font-weight:850;margin:18px 0 10px;font-size:14px}
.postBack:hover{color:#fff}
.postHead .postCat{font-size:13px}
.postHead h1{font-size:clamp(28px,4.6vw,46px);line-height:1.14;margin:10px 0 14px;letter-spacing:-1px}
.postCoverBig{height:210px;border-radius:24px;display:grid;place-items:center;font-size:74px;border:1px solid rgba(255,255,255,.14);margin:18px 0 22px;position:relative;overflow:hidden}
.postCoverBig:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(124,58,237,.30),rgba(10,15,42,.55))}
.postCoverBig span{position:relative;z-index:1}
.tagRow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.tagPill{padding:5px 11px;border-radius:999px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.3);font-size:12px;font-weight:800;color:#d8b4fe}
.shareRow{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 6px;align-items:center}
.postBody{font-size:16px;line-height:1.85;color:#dbe8fb}
.postBody h2{font-size:24px;margin:34px 0 12px;color:#fff;line-height:1.3}
.postBody h3{font-size:19px;margin:26px 0 10px;color:#fff}
.postBody p{margin:0 0 16px}
.postBody ul,.postBody ol{margin:0 0 18px;padding-left:24px}
.postBody li{margin-bottom:8px}
.postBody ul.tasks{list-style:none;padding-left:4px}
.postBody ul.tasks li{margin-bottom:9px}
.postBody blockquote{border-left:3px solid #ff2e9e;background:rgba(255,46,158,.07);padding:14px 18px;border-radius:0 16px 16px 0;margin:0 0 18px;color:#ffd5f0}
.postBody code{background:rgba(139,92,246,.16);padding:2px 7px;border-radius:8px;font-size:14px}
.postBody pre{background:#0a0f1f;border:1px solid var(--line);border-radius:16px;padding:16px;overflow:auto;margin:0 0 18px}
.postBody pre code{background:none;padding:0}
.postBody hr{border:0;height:1px;background:var(--line);margin:26px 0}
.postBody a{color:#93c5fd;text-decoration:underline}
details.faq{border:1px solid rgba(139,92,246,.38);background:rgba(139,92,246,.08);border-radius:14px;margin:0 0 12px;overflow:hidden}
details.faq summary{cursor:pointer;padding:13px 16px;font-weight:800;color:#e9d5ff;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;user-select:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary:after{content:"▾";color:#ff9f43;transition:.2s;flex:none}
details.faq[open] summary:after{transform:rotate(180deg)}
details.faq[open] summary{border-bottom:1px solid rgba(139,92,246,.25)}
details.faq p{margin:0 0 9px;color:#c9d8ed}
details.faq p:last-child{margin:0}
details.faq .faqInner{padding:12px 16px 14px}
.mdTable{overflow:auto;margin:0 0 18px}
.mdTable table{min-width:560px;border:1px solid var(--line);border-collapse:separate;border-spacing:0;border-radius:14px;overflow:hidden}
.mdTable th{background:rgba(139,92,246,.16);color:#e9d5ff}
.mdTable td,.mdTable th{padding:11px 13px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.mdTable td:last-child,.mdTable th:last-child{border-right:0}
.mdTable tr:last-child td{border-bottom:0}
.postFoot{margin:26px 0;display:flex;gap:10px;flex-wrap:wrap}
.related h2{margin:0 0 14px}
.emptyBlog{padding:60px 20px;text-align:center;color:var(--muted)}
.blogEditor textarea{min-height:340px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.7}
.blogEditorGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.adminPostList .postGrid{grid-template-columns:1fr 1fr}
.adminPostList .postCard{flex-direction:row;align-items:center;gap:14px}
.adminPostList .postCover{width:72px;height:72px;font-size:28px;flex:none}
@media(max-width:900px){.postGrid,.adminPostList .postGrid{grid-template-columns:1fr}.blogEditorGrid{grid-template-columns:1fr}.platform-strip{grid-template-columns:repeat(2,1fr)}}

/* ===== v4 wallet / refund additions ===== */
.txIn{color:#1fd2a4;font-weight:800}
.txOut{color:#ff5e73;font-weight:800}
.card .table small.txIn,.card small.txIn{display:block;color:#1fd2a4;font-weight:800}
td small.txIn{display:block}
.wdBig{font-size:26px;font-weight:900}
.holdDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd166;margin-right:6px}
.tab[disabled]{opacity:.5;cursor:not-allowed}
.searchBar select,input[type=number]{color-scheme:dark}

/* ===== TRUSTEDSMM brand logo ===== */
.logo{overflow:hidden;padding:0}
.logo svg{width:100%;height:100%;display:block}
.brandGrad{font-style:normal;background:linear-gradient(135deg,#ff4dcd,#ffaa33);-webkit-background-clip:text;background-clip:text;color:transparent}
.screenLogo{overflow:hidden;padding:0}
.screenLogo svg{width:100%;height:100%;display:block}
.footerBrand{display:inline-flex;align-items:center;gap:9px}
.footerBrand svg{width:24px;height:24px;flex:none}


/* ================= TRUSTEDSMM — MIDNIGHT LUXE / 3D MOTION THEME ================= */
:root{
  --bg:#07070d;--card:#12111c;--card2:#1a1726;--text:#faf7ff;--muted:#aaa7ba;
  --line:rgba(255,255,255,.105);--blue:#a78bfa;--green:#73f2cf;--pink:#ff54c8;
  --orange:#ffb36c;--shadow:0 30px 90px rgba(0,0,0,.48);--r:24px;
  --lux-violet:#8c55ff;--lux-pink:#fa4ab9;--lux-cyan:#64e6ff;
}
html{color-scheme:dark;scroll-padding-top:92px}
body{
  background:
    radial-gradient(ellipse at 12% 3%,rgba(116,67,255,.19),transparent 34%),
    radial-gradient(ellipse at 93% 11%,rgba(255,52,169,.13),transparent 31%),
    radial-gradient(ellipse at 48% 80%,rgba(48,139,255,.075),transparent 42%),
    linear-gradient(180deg,#08070e 0%,#0a0812 48%,#06060b 100%);
  color:var(--text);overflow-x:hidden;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
::selection{background:rgba(230,82,210,.34);color:#fff}
.ambient-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;isolation:isolate}
.ambient-layer:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);background-size:68px 68px;opacity:.3;mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.48) 48%,transparent 90%)}
.ambient-orb{position:absolute;display:block;border-radius:50%;filter:blur(72px);opacity:.25;animation:ambientDrift 19s ease-in-out infinite alternate;will-change:transform}
.ambient-orb.orb-a{width:min(46vw,620px);aspect-ratio:1;top:-22%;left:-14%;background:radial-gradient(circle,rgba(130,73,255,.9),rgba(130,73,255,0) 68%)}
.ambient-orb.orb-b{width:min(43vw,560px);aspect-ratio:1;top:4%;right:-16%;background:radial-gradient(circle,rgba(255,53,164,.8),rgba(255,53,164,0) 68%);animation-delay:-7s}
.ambient-orb.orb-c{width:min(40vw,500px);aspect-ratio:1;bottom:-27%;left:34%;background:radial-gradient(circle,rgba(73,122,255,.72),rgba(73,122,255,0) 70%);animation-delay:-12s}
.cursor-glow{position:fixed;left:50vw;top:50vh;width:430px;height:430px;z-index:0;pointer-events:none;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(191,112,255,.105),rgba(91,111,255,.045) 38%,transparent 72%);filter:blur(9px);mix-blend-mode:screen;opacity:.8;transition:opacity .3s}
.top{position:sticky;z-index:20;background:rgba(8,7,14,.76);border-bottom:1px solid rgba(255,255,255,.085);backdrop-filter:blur(22px) saturate(145%);box-shadow:0 12px 42px rgba(0,0,0,.2)}
.nav{min-height:76px}
.brand{font-size:20px;letter-spacing:.045em;transition:transform .3s ease}
.brand:hover{transform:translateY(-1px)}
.logo{border:1px solid rgba(255,255,255,.34);box-shadow:0 10px 28px rgba(181,70,255,.28),inset 0 1px 0 rgba(255,255,255,.32);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.brand:hover .logo{transform:perspective(400px) rotateX(-9deg) rotateY(14deg) translateY(-2px);box-shadow:0 18px 40px rgba(181,70,255,.42),inset 0 1px 0 rgba(255,255,255,.36)}
.brandGrad,.grad,.gradText{background:linear-gradient(100deg,#ff73d2 0%,#ffb477 32%,#b98aff 68%,#73dfff 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientSweep 8s linear infinite}
.links a:not(.btn){border:1px solid transparent;transition:background .22s,border-color .22s,color .22s,transform .22s}
.links a:not(.btn):hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.08);color:#fff;transform:translateY(-1px)}
.pill{background:rgba(112,242,207,.09);border-color:rgba(112,242,207,.21);color:#b9ffed;box-shadow:inset 0 1px rgba(255,255,255,.07)}
.wrap{position:relative;z-index:1}
.hero{padding:58px 0 36px;gap:clamp(18px,2.5vw,28px);perspective:1500px}
.heroBox,.card,.adminCard,.blogHeroCard,.modalBox{
  background:linear-gradient(145deg,rgba(25,21,39,.88),rgba(12,11,20,.9));
  border:1px solid rgba(255,255,255,.105);
  box-shadow:0 26px 76px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.075);
  backdrop-filter:blur(18px) saturate(135%);
}
.heroBox{padding:clamp(30px,4vw,50px);border-radius:32px;isolation:isolate;transform-style:preserve-3d;overflow:hidden;box-shadow:0 34px 100px rgba(0,0,0,.5),0 0 55px rgba(135,75,255,.08),inset 0 1px 0 rgba(255,255,255,.13)}
.heroBox:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(118deg,transparent 6%,rgba(255,255,255,.04) 28%,transparent 46%),radial-gradient(ellipse at 12% 3%,rgba(145,91,255,.15),transparent 55%);mask-image:linear-gradient(180deg,#000,transparent 95%)}
.heroBox:after{content:"";position:absolute;z-index:0;right:-145px;top:-155px;width:360px;height:360px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,70,196,.21),rgba(122,72,255,.09) 42%,transparent 72%);filter:blur(5px);animation:orbBreathe 8s ease-in-out infinite}
.heroBox>*{position:relative;z-index:1}
.hero h1,.postHead h1,.blogHeroTitle{font-weight:900;letter-spacing:-.055em}
.hero h1{line-height:.99;text-wrap:balance;text-shadow:0 12px 40px rgba(0,0,0,.2)}
.hero p{color:#d0cadc;line-height:1.8}
.tag{background:rgba(255,84,200,.085);border-color:rgba(255,84,200,.22);color:#ffd8f3;box-shadow:inset 0 1px rgba(255,255,255,.08)}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;margin-right:8px;background:var(--green);box-shadow:0 0 12px rgba(115,242,207,.95);animation:statusPulse 1.9s ease-in-out infinite}
.head{margin-top:40px}
.head h1,.head h2{letter-spacing:-.035em}
.head p{color:#a9a4b8}
.card,.adminCard,.blogHeroCard,.modalBox{border-radius:24px;transition:border-color .25s,box-shadow .25s,background .25s}
.card:hover,.adminCard:hover{border-color:rgba(207,160,255,.2);box-shadow:0 30px 82px rgba(0,0,0,.43),inset 0 1px 0 rgba(255,255,255,.09)}
.home-login-card{border-color:rgba(255,255,255,.13);background:linear-gradient(150deg,rgba(29,23,46,.9),rgba(12,11,20,.94));box-shadow:0 28px 84px rgba(0,0,0,.45),0 0 45px rgba(207,64,208,.075);transform-style:preserve-3d}
.home-login-card>form,.home-login-card>.tabs,.home-login-card>.glassLine{transform:translateZ(16px)}
.btn{position:relative;isolation:isolate;overflow:hidden;color:#fff;background:linear-gradient(115deg,#8b52f5 0%,#c14be8 48%,#fa4ab9 100%);background-size:180% 100%;border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 32px rgba(177,69,230,.27),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s,filter .24s,background-position .5s}
.btn:before{content:"";position:absolute;top:-130%;left:-42%;width:36%;height:360%;z-index:-1;transform:rotate(25deg) translateX(-240%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.btn:hover{transform:translateY(-2px) scale(1.018);filter:brightness(1.08);background-position:100% 0;box-shadow:0 18px 42px rgba(177,69,230,.36),inset 0 1px 0 rgba(255,255,255,.28)}
.btn:hover:before{transform:rotate(25deg) translateX(570%)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.ghost{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);color:#f3ecff}
.btn.ghost:hover{background:rgba(255,255,255,.1);box-shadow:0 12px 28px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.13)}
.btn.green{background:linear-gradient(115deg,#087f68,#18bc97,#61ebc6);box-shadow:0 14px 30px rgba(22,199,157,.19),inset 0 1px 0 rgba(255,255,255,.24)}
.btn.red{background:linear-gradient(115deg,#b92c61,#f04f7f,#ff8298);box-shadow:0 14px 30px rgba(240,79,127,.19),inset 0 1px 0 rgba(255,255,255,.23)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid rgba(207,153,255,.9);outline-offset:3px}
.tabs{gap:10px}
.tab{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.1);transition:transform .2s,background .25s,border-color .25s,box-shadow .25s}
.tab:hover{transform:translateY(-1px);border-color:rgba(207,153,255,.25)}
.tab.active{background:linear-gradient(115deg,#7e4ce3,#ad52ea,#ed53b8);border-color:rgba(255,255,255,.2);box-shadow:0 10px 28px rgba(181,75,224,.24)}
input,select,textarea{background:rgba(7,8,15,.77);border-color:rgba(255,255,255,.12);color:#faf7ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.025);transition:border-color .22s,box-shadow .22s,background .22s}

const BLOG_DEFAULTS=[{"id":1,"slug":"trustedsmm-india-trusted-smm-panel-guide","cat":"TRUSTEDSMM","title":"TRUSTEDSMM Kya Hai? India Ka Trusted SMM Panel — Complete Guide","cover":"⭐","date":"2026-08-01","author":"TRUSTEDSMM Growth Desk","views":0,"readMin":7,"tags":["SMM Panel","TRUSTEDSMM","India","Guide"],"excerpt":"SMM panel kya hota hai, TRUSTEDSMM par kya-kya services milti hain, payment kaise hota hai aur hum par trust kyun karein — sab kuch ek hi guide me.","content":"Instagram followers, YouTube views, Telegram members — ye sab aaj kal har creator aur business ko chahiye. Par quality services bahut mehengi hoti hain. Yahan aata hai **SMM Panel** ka kaam.\n\n## SMM Panel Kya Hai? (Simple Language Me)\n\nSMM ka matlab **Social Media Marketing**. SMM panel ek online platform hai jahan se aap apne (ya apne client ke) Instagram, YouTube, Telegram, Facebook, Twitter/X, TikTok jaise accounts ke liye **followers, likes, views, comments, members, watchtime** order kar sakte ho.\n\nYe services bade automation networks se deliver hoti hain, isliye price market se **bahut low** hota hai. Aap khud hi retail website se followers kharidoge to 5x–10x zyada dena padega — panel par wahi service aadhi se bhi kam rate par milti hai.\n\n## TRUSTEDSMM Par Kya-Kya Services Milti Hain?\n\n| Platform | Services | Popular Examples |\n|---|---|---|\n| Instagram | Followers, Reels Views, Likes, Comments, Shares, Saves, Story Views, Reach, Indian & USA Followers | HQ Profiles Non Drop Followers, Indian Followers Lifetime |\n| YouTube | Subscribers, Views, Watchtime, Livestream Viewers, Likes, Native Ads Views | Watchtime Zero Drop, Native Ads View India |\n| Telegram | Members, Premium Members, Post Views, Auto Post Views | Premium Members + Views 30 Days, Indian Premium Post View 365 Days |\n| Facebook | Followers, Likes, Reels/Video Views, Live Stream Views | Facebook Followers HQ Profiles, Live Stream Views |\n| Twitter/X | Followers, Likes, Views, Comments, Spaces Listeners, Poll Votes, Live Viewers | X Followers Non Drop, Spaces Listeners |\n| TikTok / Discord / Twitch / Snapchat / Kick / LinkedIn / Website | Likes, Views, Members, Boosts, Chat Bots, Traffic | Discord x14 Server Boost, Twitch Chat Bot, Website Traffic |\n\nHar service par **min/max quantity, price per 1000** aur quality label clearly likha hota hai — koi hidden cheez nahi.\n\n## TRUSTEDSMM Kyun Choose Karein?\n\n- **24/7 WhatsApp Support** — order ho ya payment, har problem ka seedha solution\n- **UPI / QR / Bank Transfer** — Indian users ke liye sabse easy payment options\n- **Wallet System** — ek baar funds add karo, kabhi bhi instant order karo\n- **Panel Rates** — wholesale jaisi prices, retail jaisi quality\n- **Fast Delivery** — zyada services turant start ho jaati hain\n- **Manual Fund Verification** — har payment admin verify karta hai, fraud ka zero chance\n- **Admin Control** — live order status, remains tracking, refund/refill handling\n\n## Ordering ka Basic Flow (2 Minute ka Kaam)\n\n1. **Register karo** — naame, user ID, email, password — bas itna hi.\n2. **Login karke Add Funds page kholo** — UPI QR scan karo ya bank details se pay karo.\n3. **UTR / Reference number submit karo** + payment proof upload karo.\n4. **Admin verify karega** (5–30 min) — balance wallet me credit.\n5. **Services page se service choose karo** — link + quantity daalo — **Order Place!**\n\nDelivery turant ya specified speed me start hoti hai, aur aap dashboard me order status live dekh sakte ho.\n\n## Important Tips\n\n- Order karne se pehle service ka **min/max** check karo — quantity uske andar honi chahiye.\n- Link **sahi format** me daalo (profile link followers ke liye, post link views ke liye).\n- \"Non Drop\" services me quantity drop nahi hoti — budget me ho to inhe prefer karo.\n- Koi bhi problem ho to **WhatsApp support** par message karo — order ID ke saath bhejo, jaldi resolve hota hai.\n\n## FAQ\n\nQ: Kya TRUSTEDSMM safe hai?\nA: Haan — payment proof ke bina koi fund approve nahi hota, aur customer data private rehta hai.\n\nQ: Delivery kitni fast hai?\nA: Service ke hisaab se alag — kuch instant, kuch 24–72 ghante me start hote hain. Order page par speed likhi hoti hai.\n\nQ: Price per kya hai?\nA: Saari rates **per 1000** hoti hain — order page par live charge dikh jaata hai quantity daalte hi.\n\nTRUSTEDSMM par apna growth start karo — register karo, funds add karo aur apne favorite platform par order karo. Baki sab humara system sambhal lega!"},
{"id":2,"slug":"instagram-growth-trustedsmm-guide","cat":"Instagram","title":"Instagram Followers, Likes & Reels Views — TRUSTEDSMM Ordering Guide","cover":"📸","date":"2026-07-28","author":"TRUSTEDSMM Growth Desk","views":0,"readMin":6,"tags":["Instagram","Followers","Reels Views","Likes","Order Guide"],"excerpt":"Instagram par followers, reels views, likes aur comments order karna seekho — Indian/USA followers, quality options, delivery speed aur pro tips.","content":"Instagram aaj bhi India ka sabse bada branding platform hai. Naye account ko organic grow karna slow hota hai — isliye smart creators initial boost ke liye **TRUSTEDSMM panel** use karte hain. Ye guide batata hai kaise.\n\n## TRUSTEDSMM Instagram Services — Full List\n\n| Service | Best For |\n|---|---|\n| Instagram Followers 💧 Less Drop | Budget me start |\n| Instagram Followers ⭐ HQ Profiles + Non Drop | Personal / professional accounts |\n| Instagram Followers 🔥 HQ Profiles Non Drop | High quality, maximum retention |\n| Instagram Indian Followers (Slow / 365 Days / Lifetime) | Indian audience chahiye ho |\n| Instagram USA Followers Non Drop | International branding |\n| Instagram Reels Views (Super Fast / All Link / Super Instant) | Reels par instant reach |\n| Instagram Photo Views Non Drop | Post views |\n| Instagram Likes (HQ / Aged Account / Real Profiles / Indian) | Engagement boost |\n| Instagram Comments (Indian Permanent / Custom HQ) | Social proof |\n| Shares, Saves, Story Views, Reach + Impressions, Repost | Full engagement pack |\n\n## Step-by-Step Order Kaise Karein\n\n1. **Login karo** TRUSTEDSMM par (register nahi kiya to pehle 2 minute me account banao).\n2. **Add Funds** — UPI QR scan / bank transfer karke UTR submit karo, admin verify karega.\n3. **Services** page kholo, **Instagram** category me jao.\n4. Service choose karo — example: \"Instagram Followers ⭐ HQ Profiles Non Drop\".\n5. Apna **profile link** paste karo (https://instagram.com/username).\n6. **Quantity** daalo (min–max ke andar) — live charge dikhega.\n7. **Place Order** — wallet se charge deduct, delivery start!\n\n## Kaunsi Quality Choose Karein?\n\n| Need | Recommended Service |\n|---|---|\n| Sirf number badhana hai, budget low | Followers Less Drop |\n| Real-looking growth, drop na ho | HQ Profiles Non Drop |\n| Indian audience / regional branding | Indian Followers Lifetime / 365 Days |\n| International reach | USA Followers Non Drop |\n| Reels viral dikhana hai | Reels Views Super Fast + Likes combo |\n\n## Delivery & Refill Policy\n\n- **Non Drop** ka matlab — quantity add hone ke baad girti nahi.\n- Agar kisi wajah se delivery incomplete ho ya issue aaye, to **WhatsApp support** par order ID bhejo — admin check karke refill/refund ka solution deta hai.\n- Views/likes ki speed service name me likhi hoti hai (Fast, Super Fast, Instant) — usi hisaab se expect karo.\n\n## Pro Tips — Natural Growth Ke Liye\n\n- Followers order ke saath **2–3 days gap** me likes/views bhi order karo — account natural dikhta hai.\n- Naya account ho to pehle **1000 HQ followers** lo, phir content par focus karo — logo ko social proof dikhta hai.\n- Stories aur highlights bhi update karte raho — panel boost + consistent content = best combo.\n- Reels views ke liye **post link** chahiye hota hai, profile link nahi — dhyan rakho.\n\nInstagram ka game simple hai: **pehle numbers, phir quality content, phir conversion.** TRUSTEDSMM pehla step sambhal deta hai — baaki aapka kaam hai!"},
{"id":3,"slug":"youtube-growth-trustedsmm-guide","cat":"YouTube","title":"YouTube Subscribers, Views & Watchtime — Complete Growth Guide","cover":"🎬","date":"2026-07-22","author":"TRUSTEDSMM Growth Desk","views":0,"readMin":6,"tags":["YouTube","Subscribers","Views","Watchtime","Monetization"],"excerpt":"YouTube channel grow karo TRUSTEDSMM ke saath — subscribers, views, watchtime, livestream viewers order karna aur monetization tak ka poora plan.","content":"YouTube sirf video platform nahi — **search engine aur earning machine** hai. Par naye channel ko pareshaani hoti hai: views nahi aate, subscribers nahi badhte, aur monetization door-door tak nahi dikhti. TRUSTEDSMM is growth gap ko fill karta hai.\n\n## TRUSTEDSMM YouTube Services\n\n| Service | Kya Kaam Karti Hai |\n|---|---|\n| YouTube Subscribers (Drop / Zero Drop) | Channel subscriber count badhao |\n| YouTube Watchtime Zero Drop | Monetization ke liye watch hours badhao |\n| YouTube Views Non Drop | Videos par views, jo girte nahi |\n| YouTube Native Ads View (India, Min 1K/3K/10K/40K/100K) | Real-looking views India se |\n| YouTube Livestream Viewers (60 Min se 24 Hours) | Live stream par real viewers |\n| YouTube Likes [All Links] | Engagement + ranking signal |\n| YouTube Pre-Premiere Waitings | Premiere event hype |\n\n## Step-by-Step Order Kaise Karein\n\n1. Login karo → **Add Funds** (UPI/bank) → admin verify ke baad wallet ready.\n2. **Services → YouTube** kholo.\n3. Service choose karo — jaise \"YouTube Views Non Drop\".\n4. **Video link** paste karo (https://youtube.com/watch?v=...) ya channel link (subscribers ke liye).\n5. Quantity daalo → **Place Order** — dashboard me status live dikhega.\n\n## Watchtime Aur Monetization — Important Baat\n\nMonetization ke liye YouTube ke eligibility criteria hote hain (subscribers + watch hours). Wahi **Watchtime Zero Drop** service kaam aati hai — channel par required watch hours badha deti hai. Lekin ek honest baat:\n\n> Ye service growth ka **shortcut** hai, quality content ka **replacement nahi**. Views/subscribers boost lo, lekin saath me videos bhi aisi banao jo log end tak dekhein — tabhi growth permanent hoti hai.\n\n## Livestream Viewers Guide\n\nGaming ya live content banate ho? **YouTube Livestream Viewers** service kharido — 60 min se 24 hours tak ke packages hain. Live stream par viewers dikhenge, chat alive lagegi, aur algorithm live audience ko boost karta hai. Twitch ke liye bhi alag services hain (views, followers, chat bots).\n\n## Growth Plan — 30 Days Roadmap\n\n| Week | Action |\n|---|---|\n| Week 1 | 500–1000 subscribers order karo + channel art/thumbnails improve |\n| Week 2 | Har video par Views Non Drop (2K–5K) + Likes |\n| Week 3 | Watchtime Zero Drop order karo + 2 quality videos upload |\n| Week 4 | Livestream viewers test karo + analyze analytics |\n\n## Pro Tips\n\n- **Video link vs Channel link** — views/views ke liye video link, subscribers ke liye channel link. Galat link se order fail hota hai.\n- Min quantity respect karo — jo service 1000 min likhi hai, usme 500 nahi daal sakte.\n- **Kisi bhi issue par WhatsApp support** — order ID ke saath bhejo, admin turant dekhta hai.\n\nYouTube slow game hai, lekin sahi combination (boost + content) se 2–3 mahine me channel recognize hone lagta hai. Shuru aaj se karo!"},
{"id":4,"slug":"telegram-channel-growth-trustedsmm","cat":"Telegram","title":"Telegram Channel Growth: Members, Premium Views & Post Views Guide","cover":"✈️","date":"2026-07-15","author":"TRUSTEDSMM Growth Desk","views":0,"readMin":6,"tags":["Telegram","Members","Premium","Post Views","Channel Growth"],"excerpt":"Telegram par members, premium members aur post views kaise order karein — 2026 ki sabse effective channel growth strategy.","content":"Telegram 2026 me **sabse fast-growing platform** hai — ads nahi, full reach, aur channel owner ke paas 100% control. Isliye har business ab Telegram par channel bana raha hai. Par naya channel kaise dikhega jab members hi 0 hain? Yahan TRUSTEDSMM ka Telegram suite kaam aata hai.\n\n## TRUSTEDSMM Telegram Services\n\n| Service | Use Case |\n|---|---|\n| Telegram Members (HQ Non Drop / Lifetime / India 100%) | Channel subscriber count |\n| Telegram Premium Members (7/15/30/90 Days) | Premium badge wale members |\n| Premium Members + Views Combos | Member + post views ek saath |\n| Telegram Post Views (Normal Speed / Auto Post Views) | Har post par views |\n| Indian Premium Post View (365 Days) | Indian audience ke posts |\n| Telegram Member High Quality Non Drop | Drop-free growth |\n| Fake Views For De-Ranking | Competitor channel handle karna (advanced) |\n\n## Step-by-Step Order Kaise Karein\n\n1. **Login → Add Funds** (UPI QR / bank transfer, admin verify).\n2. **Services → Telegram** me jao.\n3. Members chahiye? **Channel link** paste karo (https://t.me/yourchannel).\n4. Post views chahiye? **Post link** paste karo.\n5. Quantity daalo → **Place Order** → delivery start.\n\n## Auto Post Views — Kya Hai Aur Kaise Kaam Karta Hai?\n\nTelegram ki sabse popular service **Auto Post Views** hai — aap channel me jitne posts banate ho (5/10/20/50/100/500/1000 posts ke packages), har naye post par views auto-add hote hain. Ye service:\n\n- Channel ko **alive** dikhati hai — har post par views dikhte hain\n- **1,000,000+ reach** wal {"id":5,"slug":"trustedsmm-add-funds-wallet-guide","cat":"Payments","title":"TRUSTEDSMM Wallet & Payments: Add Funds Ka Full Guide (UPI, QR, Bank)","cover":"💳","date":"2026-07-09","author":"TRUSTEDSMM Growth Desk","views":0,"readMin":7,"tags":["Wallet","Add Funds","UPI","Payment","Guide"],"excerpt":"TRUSTEDSMM wallet me funds kaise add karein — UPI QR scan, bank transfer, UTR submit, proof upload aur approval ka step-by-step guide.","content":"TRUSTEDSMM par orders ka paisa **wallet balance** se deduct hota hai — matlab pehle funds add karo, phir kabhi bhi 1 minute me order karo. Ye guide aapko Add Funds ka poora process sikhata hai, payment method se lekar approval tak.\n\n## Wallet Kya Hai?\n\nWallet aapka TRUSTEDSMM account ka balance hai. Jab aap fund request submit karte ho aur admin approve karta hai, to balance credit ho jaata hai. Har order ka charge isi balance se kata jaata hai — baar-baar payment karne ki zaroorat nahi.\n\n## Payment Methods — TRUSTEDSMM Par\n\n| Method | Kaise Kaam Karta Hai |\n|---|---|\n| UPI | QR code scan karo → UPI app (GPay/PhonePe/Paytm/BHIM) se pay → UTR/Ref ID submit karo |\n| Bank Transfer | Admin ke bank details se NEFT/IMPS → Reference number submit karo |\n| Paytm | Paytm app se transfer → transaction ID submit karo |\n\n## Step-by-Step Add Funds Process\n\n1. **Login** karo → navbar me **\"Add Funds\"** click karo.\n2. Apna **current balance** dekho (right side card me).\n3. **Amount** daalo (minimum amount payment settings me likha hota hai).\n4. **Method** choose karo — UPI / Bank Transfer / Paytm.\n5. **Payment karo**:\n   - UPI: QR scan karke pay karo\n   - Bank: account holder, bank name, account number, IFSC — in details se transfer karo\n6. **UTR / Reference number** daalo — ye transfer ke baad milta hai (UPI apps me \"Reference ID\" / bank me UTR).\n7. **Payment proof** upload karo (screenshot) — isse verification fast hoti hai.\n8. **Submit Request** — status \"Pending\" dikhega.\n\n## Approval Ke Baad Kya Hota Hai const WD={PENDING:'Pending',PAID:'Paid',REJECTED:'Rejected'};

function num(v,def){const n=Number(v);return isFinite(n)?n:(typeof def==='number'?def:0)}
function round4(v){return +Number(v||0).toFixed(4)}

function dedupeById(list){const seen={},out=[];(list||[]).forEach(it=>{if(it&&it.id!=null){const k=String(it.id);if(!seen[k]){seen[k]=1;out.push(it)}}});return out}

/* ---- tombstone helpers ---- */
function addTombstoneSafe(key,id){try{addTombstone(key,id)}catch(e){}}
function clearTombstone(key,id){if(!state.deleted||!Array.isArray(state.deleted[key]))return;const t=String(id);state.deleted[key]=state.deleted[key].filter(x=>String(x)!==t)}
function purgeTombstones(key){if(state.deleted)state.deleted[key]=[]}
/* DELETE-WINS helpers (v4.1): do deleted-lists ka union + tombstoned records ko
   state se nikaalna. Delete ke baad purana localStorage/cloud snapshot kuch bhi
   wapas zinda na kare — isiliye har load/merge/save par prune chalta hai. */
function unionDeleted(a,b){const o={};['users','orders','funds','txns','services','withdrawals','blogs'].forEach(k=>{const seen={};((a&&a[k])||[]).forEach(id=>seen[String(id)]=1);((b&&b[k])||[]).forEach(id=>seen[String(id)]=1);o[k]=Object.keys(seen).slice(-6000)});return o}
function pruneTombstoned(st){if(!st||!st.deleted)return st;for(const key of ['users','orders','funds','txns','services','withdrawals','blogs']){const del=(st.deleted[key]||[]).map(String);if(!del.length||!Array.isArray(st[key]))continue;st[key]=st[key].filter(it=>it&&it.id!=null&&del.indexOf(String(it.id))<0)}return st}
/* Delete ka asli fix: (1) record state.se se hatao, (2) tombstone daalo taaki koi aur
   tab / cloud snapshot usse wapas zinda na kare, (3) Firestore ka doc foran delete karo. */
function dropRecords(key,ids){
  const list=(ids||[]).map(id=>String(id)).filter(Boolean);
  if(!list.length)return [];
  list.forEach(id=>addTombstoneSafe(key,id));
  state[key]=(state[key]||[]).filter(it=>list.indexOf(String(it&&it.id))<0);
  /* tombstones/config turant cloud par push karo — reload se pehle delete pakka */
  if(firebaseReady&&firebaseDb){try{syncNow()}catch(e){}}
  if(firebaseReady&&firebaseDb){
    (async()=>{try{let i=0;while(i<list.length){const part=list.slice(i,i+450);i+=450;const batch=firebaseDb.batch();part.forEach(id=>batch.delete(firebaseDb.collection(key).doc(id)));await batch.commit();list.forEach(id=>{if(_cloud[key])delete _cloud[key][id]})}}catch(e){console.error('hard delete failed ('+key+'):',e);scheduleCloudWrite()}})()
  }
  return list
}

/* ---- wallet math ---- */
function wcfg(){
  const s=(state.settings&&state.settings.withdraw)||{};
  return{
    enabled:s.enabled===undefined?true:(s.enabled!==false&&String(s.enabled)!=='false'),
    min:clampNum(s.min,1,10000000,100),
    fee:clampNum(s.fee,0,50,0),
    max:Math.max(0,num(s.max)),
    methods:(Array.isArray(s.methods)&&s.methods.length?s.methods:['UPI','Bank Transfer','Paytm']).map(v=>String(v)).filter(Boolean),
    payoutNote:String(s.payoutNote||''),
    instructions:String(s.instructions||'')
  }
}
/* Wallet model:
   u.balance = spendable balance (jo order/refund me use hota hai)
   u.held    = payout request par reserved amount (balance me se ALAG bucket)
   'total wallet' = balance + held  -> UI me money/balance wahi dikhta hai      */
function walletOf(u){
  const avail=round4(Math.max(0,num(u&&u.balance)));
  const held=round4(Math.max(0,num(u&&u.held)));
  return{available:avail,held:held,balance:round4(avail+held)}
}
function ledgerSum(id){return round4((state.txns||[]).filter(t=>String(t.userId)===String(id)).reduce((a,t)=>a+num(t.amount),0))}
function walletIntegrity(u){const w=walletOf(u),s=ledgerSum(u.id);return{ledger:s,wallet:w.balance,diff:round4(s-w.balance)}}
function feeOf(amount,percent){const p=clampNum(percent===undefined?wcfg().fee:percent,0,50,0);return round4(Math.max(0,num(amount))*p/100)}
function withdrawals(){return arrOf(state.withdrawals)||[]}
function withdrawalsOf(id){return withdrawals().filter(w=>id==null||String(w.userId)===String(id))}
function pendingPayouts(){return withdrawals().filter(w=>w.status===WD.PENDING)}
function payoutTotal(status){return round4(withdrawals().filter(w=>!status||w.status===status).reduce((a,w)=>a+Math.max(0,num(w.amount)),0))}
function txnsOf(id,limit){let list=(state.txns||[]).filter(t=>String(t.userId)===String(id)).slice().reverse();return limit?list.slice(0,limit):list}
function pushTxn(userId,type,amount,note,extra){const t=Object.assign({id:newId(),userId:userId,type:type,amount:round4(amount),note:note||'',date:now()},extra||{});(state.txns||(state.txns=[])).push(t);return t}
function depositTotal(id){return round4((state.funds||[]).filter(f=>String(f.userId)===String(id)&&f.status==='Approved').reduce((a,f)=>a+num(f.amount),0))}
function refundTotal(id){return round4((state.orders||[]).filter(o=>String(o.userId)===String(id)).reduce((a,o)=>a+Math.max(0,num(o.refunded)),0))}
function nextWdId(){state.next||(state.next={});const maxId=withdrawals().reduce((a,w)=>Math.max(a,num(w.id)),0);state.next.withdraw=Math.max(num(state.next.withdraw,7001),maxId+1);return state.next.withdraw++}

/* held ko user ke pending payout requests ke sum se match karao (self-healing) */
function syncHoldQuiet(u){if(!u)return false;const sum=round4(withdrawalsOf(u.id).filter(w=>w.status===WD.PENDING).reduce((a,w)=>a+Math.max(0,num(w.amount)),0));if(Math.abs(round4(num(u.held))-sum)>0.005){u.held=sum;return true}return false}

/* ---- refund engine ---- */
function orderRefundTarget(o){
  if(!o)return 0;
  const charge=Math.max(0,round4(o.charge)),qty=Math.max(0,num(o.qty)),st=String(o.status||'');
  let rem;
  if(o.remains==null)rem=(REFUND_FULL.indexOf(st)>=0||REFUND_PARTIAL.indexOf(st)>=0)?(REFUND_FULL.indexOf(st)>=0?qty:0):0;
  else rem=Math.max(0,Math.min(qty||1e12,num(o.remains)));
  if(st==='Completed')return 0;
  if(REFUND_FULL.indexOf(st)>=0)return round4(charge);
  if(REFUND_PARTIAL.indexOf(st)>=0)return round4(qty>0?charge*(rem/qty):charge);
  return 0;
}
/* Idempotent settle: jo amount already refund ho chuka hai (o.refunded) usse DIFF karke
   hi move hota hai — isliye admin status baar-baar update kare to double refund nahi lagega,
   aur cancel hatakar order dobara Processing karne par refund wapas deduct ho jata hai. */
function settleOrderRefund(o,opts){
  opts=opts||{};
  if(!o)return 0;
  const target=orderRefundTarget(o),done=round4(Math.max(0,num(o.refunded))),delta=round4(target-done);
  const u=state.users.find(x=>String(x.id)===String(o.userId));
  if(Math.abs(delta)<0.005){o.refunded=done;delete o.refundPending;return 0}
  if(delta>0){
    if(u){
      u.balance=round4(Math.max(0,num(u.balance)+delta));
      u.spent=Math.max(0,round4(num(u.spent)-delta));
      pushTxn(u.id,'Refund',delta,(opts.note?opts.note+' • ':'')+'Refund #'+o.id+' • '+o.status)
    }
    o.refunded=round4(target);o.refundedAt=now();o.refundReason=opts.reason||REFUND_REASON[String(o.status)]||'Refund';
    if(opts.log&&u)adminNotify('refund',{username:u.uid,id:o.id,service:o.service,amount:delta,status:o.status,balance:walletOf(u).balance});
    return delta
  }
  const want=round4(Math.abs(delta));
  if(u){
    const avail=walletOf(u).available,take=round4(Math.min(want,avail));
    if(take>0){
      u.balance=round4(Math.max(0,num(u.balance)-take));
      u.spent=round4(num(u.spent)+take);
      pushTxn(u.id,'Debit',-take,'Refund reversed • order #'+o.id)
    }
    o.refunded=round4(Math.max(0,done-take));o.refundedAt=now();
    if(want-take>0.005)o.refundPending=round4(want-take);else delete o.refundPending;
    return -take
  }
  o.refunded=round4(target);
  return 0
}

function wdBadge(s){s=String(s||'');if(s===WD.PAID)return '<span class="badge ok">Paid</span>';if(s===WD.REJECTED)return '<span class="badge bad">Rejected</span>';return '<span class="badge warn">Pending</span>'}

  return fixed

      COLLS.forEach(([,key],i)=>applyChanges(key,changesFromSnapshot(key,snaps[i])));

function applyChanges(key,changes){
  let changed=false,keepLocal=false;state[key]=state[key]||[];
  const zapCloud=id=>{try{if(firebaseDb)firebaseDb.collection(key).doc(String(id)).delete().catch(()=>{})}catch(e2){}};
  changes.forEach(c=>{const id=String(c.doc.id),rawData=c.doc.data()||{},data=Object.assign({},rawData,{id:/^\d+$/.test(id)?Number(id):id});_cloud[key]=_cloud[key]||{};
    const arr=state[key]||[];
    /* DELETE WINS (v4.1 fix): tombstoned id cloud me dikhe to local me lao hi mat,
       local copy ho to hatao, aur cloud par bacha doc turant delete karo. */
    if(c.type!=='removed'&&((state.deleted&&state.deleted[key])||[]).map(String).indexOf(String(id))>=0){
      if(arr.some(it=>String(it.id)===id)){state[key]=arr.filter(it=>String(it.id)!==id);changed=true}
      delete _cloud[key][id];zapCloud(id);keepLocal=true;return

    if(c.type==='removed'){const n=arr.filter(it=>String(it.id)!==id);if(n.length!==arr.length){state[key]=n;changed=true}addTombstone(key,id);delete _cloud[key][id]}

        const localJs=stableStringify(local),remoteJs=stableStringify(data),baseJs=base?stableStringify(base):null;
        if(localJs===remoteJs){_cloud[key][id]=deepCopy(data)}
        else if(!base){
          /* No prior cloud version: cloud wins this first conflict. */
          arr[idx]=data;_cloud[key][id]=deepCopy(data);changed=true
        }else{
          const localDirty=localJs!==baseJs,remoteDirty=remoteJs!==baseJs;
          if(!localDirty){
            /* Local copy was clean. Always accept Firestore, even if this device's clock is ahead. */
            arr[idx]=data;_cloud[key][id]=deepCopy(data);changed=true
          }else if(!remoteDirty){
            /* Only this tab changed since its last cloud snapshot; keep and push it. */
            keepLocal=true
          }else if(key==='users'){

               cloud win conflicts on the same field (especially wallet balance). */
            const merged=deepCopy(data),fields=new Set([...Object.keys(base),...Object.keys(local),...Object.keys(data)]);
            fields.forEach(field=>{

              if(localChanged&&!remoteChanged){

  if(keepLocal)scheduleCloudWrite();
}

  if(kind==='fund')return '🔔 TRUSTEDSMM ALERT\n'+line+'\n📌 Event: 💰 NEW FUND REQUEST\n🆔 Username: '+(d.username||'-')+'\n📧 Email: '+(d.email||'-')+'\n📱 Mobile: '+(d.mobile||'-')+'\n💵 Amount: '+(d.amount!=null?money(d.amount):'-')+'\n🏦 Method: '+(d.method||'-')+'\n🔖 UTR/Ref: '+(d.ref||'-')+'\n🕐 Time: '+t+'\n'+line;
  if(kind==='withdraw')return '🔔 TRUSTEDSMM ALERT\n'+line+'\n📌 Event: 💸 NEW PAYOUT (WITHDRAW) REQUEST\n🆔 Username: '+(d.username||'-')+'\n📧 Email: '+(d.email||'-')+'\n📱 Mobile: '+(d.mobile||'-')+'\n💵 Amount: '+(d.amount!=null?money(d.amount):'-')+'\n🧾 Fee: '+(d.fee!=null?money(d.fee):'-')+'\n✅ Net Payout: '+(d.net!=null?money(d.net):'-')+'\n🏦 Method: '+(d.method||'-')+'\n🎯 To: '+(d.detail||'-')+'\n📝 Note: '+(d.note||'-')+'\n🕐 Time: '+t+'\n'+line;

  if(kind==='withdrawRejected')return '🔔 TRUSTEDSMM ALERT\n'+line+'\n📌 Event: ⛔ PAYOUT REJECTED (refunded to wallet)\n🆔 Username: '+(d.username||'-')+'\n🧾 Request: #'+(d.id!=null?d.id:'-')+'\n💵 Amount Released: '+(d.amount!=null?money(d.amount):'-')+'\n📝 Reason: '+(d.note||'-')+'\n🕐 Time: '+t+'\n'+line;
  if(kind==='refund')return '🔔 TRUSTEDSMM ALERT\n'+line+'\n📌 Event: ↩️ ORDER REFUND ISSUED\n🆔 Username: '+(d.username||'-')+'\n🧾 Order ID: #'+(d.id!=null?d.id:'-')+'\n📦 Service: '+(d.service||'-')+'\n📌 Status: '+(d.status||'-')+'\n💵 Refunded: '+(d.amount!=null?money(d.amount):'-')+'\n💳 Wallet Now: '+(d.balance!=null?money(d.balance):'-')+'\n🕐 Time: '+t+'\n'+line;

function tgPing(token,chatId,msg){
  try{const u='https://api.telegram.org/bot'+token+'/sendMessage?chat_id='+encodeURIComponent(chatId)+'&text='+encodeURIComponent(msg);
    fetch(u).then(r=>r.json()).then(j=>{if(j&&j.ok===false)console.warn('TG send fail:',j.description)}).catch(()=>{try{const im=new Image();im.src=u}catch(e2){}});
  }catch(e){console.error('tg error',e)}
}
function sendAdminNotify(kind,data,cfg){
  cfg=cfg||{};
  try{
    const msg=notifyMsg(kind,data);
    if(cfg.telegramToken&&cfg.telegramChatId)tgPing(cfg.telegramToken,cfg.telegramChatId,msg);
    if(cfg.webhookUrl)fetch(cfg.webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:kind,data:data||{},message:msg,time:new Date().toISOString()})}).catch(()=>{});
  }catch(e){console.error('notify err',e)}
}

function login(e){
  e.preventDefault();
  const f=new FormData(e.target),id=String(f.get('id')||'').trim().toLowerCase(),p=String(f.get('pass')||'').trim();

  if(u.status!=='active')return toast('Account suspended','err');

}

function slugify(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'post-'+Date.now().toString(36)}
function readMin(content){let w=String(content||'').trim().split(/\s+/).length;return Math.max(1,Math.round(w/200))}
function blogById(id){return (state.blogs||[]).find(b=>String(b.id)===String(id))}
function blogBySlug(sl){return (state.blogs||[]).find(b=>String(b.slug).toLowerCase()===String(sl||'').toLowerCase())}
function blogDate(d){try{const s=String(d||'').trim();let t;if(/^\d{4}-\d{2}-\d{2}/.test(s)){const p=s.slice(0,10).split('-').map(Number);t=new Date(p[0],p[1]-1,p[2])}else if(s){t=new Date(s)}else{return ''}if(isNaN(t.getTime()))return '';return t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}}
function stripTitleDup(content,title){const lines=String(content||'').split('\n');while(lines.length&&/^#{1,4}\s+/i.test(lines[0])&&lines[0].replace(/^#+\s*/,'').trim().toLowerCase()===String(title||'').trim().toLowerCase()){lines.shift()}while(lines.length&&!lines[0].trim()){lines.shift()}return lines.join('\n')}
function blogCoverClass(i){const gs=['linear-gradient(135deg,#7c3aed,#ff2e9e)','linear-gradient(135deg,#ff2e9e,#ff9f43)','linear-gradient(135deg,#3b82f6,#22d3ee)','linear-gradient(135deg,#22c55e,#14b8a6)','linear-gradient(135deg,#e52d27,#f97316)','linear-gradient(135deg,#0ea5e9,#6366f1)'];return gs[(Number(i)||0)%gs.length]}
function md(src){
  src=String(src||'');
  const codes=[];
  src=src.replace(/```([\s\S]*?)```/g,(m,c)=>{codes.push('<pre><code>'+esc(c.trim())+'</code></pre>');return '\u0000C'+(codes.length-1)+'\u0000'});
  const inline=raw=>esc(raw)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const lines=src.split('\n');let html='',list='';
  const close=()=>{if(list){html+='</'+list+'>';list=''}};
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(!line.trim()){close();continue}
    const codeM=line.match(/^\u0000C(\d+)\u0000$/);
    if(codeM){close();html+=codes[+codeM[1]];continue}
    const qm=line.match(/^Q[:：]\s+(.*)$/);
    if(qm){close();const qa=[];let j=i+1;while(j<lines.length&&!/^Q[:：]\s/.test(lines[j])){qa.push(lines[j]);j++}i=j-1;let ans=qa.join('\n').replace(/^\s*A[:：]\s*/,'').trim();let inner=ans?ans.split(/\n\s*\n/).map(p=>'<p>'+inline(p.trim())+'</p>').join(''):'';html+='<details class="faq"><summary><b>Q.</b> '+inline(qm[1])+'</summary><div class="faqInner">'+inner+'</div></details>';continue}
    const h=line.match(/^(#{1,3})\s+(.*)$/);
    if(h){close();let lv=h[1].length+1;html+='<h'+lv+'>'+inline(h[2])+'</h'+lv+'>';continue}
    const task=line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/);
    if(task){if(list!=='ul'){close();html+='<ul class="tasks">';list='ul'}html+='<li>'+(/x/i.test(task[1])?'☑ ':'☐ ')+inline(task[2])+'</li>';continue}
    if(/^\s*[-*]\s+/.test(line)){if(list!=='ul'){close();html+='<ul>';list='ul'}html+='<li>'+inline(line.replace(/^\s*[-*]\s+/,''))+'</li>';continue}
    if(/^\s*\d+\.\s+/.test(line)){if(list!=='ol'){close();html+='<ol>';list='ol'}html+='<li>'+inline(line.replace(/^\s*\d+\.\s+/,''))+'</li>';continue}
    if(/^\s*>\s?/.test(line)){close();const q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(inline(lines[i].replace(/^\s*>\s?/,'')));i++}html+='<blockquote>'+q.join('<br>')+'</blockquote>';i--;continue}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(line)){close();html+='<hr>';continue}
    if(/^\|.*\|\s*$/.test(line)){
      const rows=[];
      while(i<lines.length&&/^\|.*\|\s*$/.test(lines[i].trim())){rows.push(lines[i].trim());i++}i--;
      const cells=r=>r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>inline(c.trim()));
      let tb='<div class="mdTable"><table><thead><tr>';
      tb+=cells(rows[0]).map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
      for(let r=1;r<rows.length;r++){if(rows[r].replace(/^\|/,'').replace(/\|$/,'').split('|').every(c=>/^\s*:?-{2,}:?\s*$/.test(c)))continue;tb+='<tr>'+cells(rows[r]).map(c=>'<td>'+c+'</td>').join('')+'</tr>'}
      tb+='</tbody></table></div>';
      html+=tb;continue;
    }
    close();
    html+='<p>'+inline(line)+'</p>';
  }
  close();
  return html.replace(/\u0000C\d+\u0000/g,'');
}

function adminDatabase(){
  const connected=!!(firebaseReady&&firebaseDb&&firebaseState!=='error');
  const label=firebaseState==='error'?'SYNC ERROR':connected?'CONNECTED':String(firebaseState||'not checked').toUpperCase();
  const badgeClass=firebaseState==='error'?'bad':connected?'ok':'warn';
  $('#adminBox').innerHTML=`<div class="adminCard"><div class="adminPanelHead"><div><h2>Live Database Check</h2><p class="muted small">Firestore status, read/write check aur pending data sync yahan verify karein.</p></div><span class="badge ${badgeClass}" id="dbStatus">${esc(label)}</span></div><div class="softBox"><b>Database:</b><p class="muted">Firebase Firestore • project configured in this file</p><p class="muted">Browser cache alag rahega; successful Firestore sync ke baad hi cloud update confirm hoga.</p><div class="notice warn"><b>Security:</b> Website ka custom login Firebase Auth nahi hai. Wallet/users ke liye Firebase Security Rules aur authenticated backend zaroori hain; client-side admin check Firestore ko secure nahi karta.</div>${firebaseLastError?`<div class="notice err"><b>Last error:</b> ${esc(firebaseLastError)}</div>`:''}<button class="btn" id="checkDatabaseBtn">☁️ Check &amp; Sync Database</button></div></div>`;
  $('#checkDatabaseBtn').onclick=checkDatabase
}
async function checkDatabase(){
  const b=$('#checkDatabaseBtn'),badge=$('#dbStatus');
  if(b){b.disabled=true;b.textContent='Checking Firestore...'}
  if(badge){badge.textContent='CHECKING';badge.className='badge warn'}
  try{
    if(!firebaseDb)throw new Error('Firebase SDK load nahi hua — network/CDN check karein.');
    if(!firebaseReady){const loaded=await loadFirebase();if(!loaded)throw new Error(firebaseLastError||'Firestore collections load nahi ho payi.')}
    const ref=firebaseDb.collection('config').doc('main');
    await ref.set({databaseStatus:{lastCheckedAt:new Date().toISOString(),status:'live'}},{merge:true});
    const snap=await ref.get();if(!snap.exists)throw new Error('Firestore health check document read nahi hua.');
    const synced=await syncNow();if(!synced)throw new Error(firebaseLastError||'Pending collection writes sync nahi huye.');
    firebaseState='connected';firebaseLastError='';
    if(badge){badge.textContent='LIVE • SYNCED';badge.className='badge ok'}
    toast('Firestore read/write check pass — pending changes sync ho gaye.')
  }catch(e){
    firebaseState='error';firebaseLastError=dbErrorMessage(e);
    console.error('Firestore health check failed:',e);
    if(badge){badge.textContent='CHECK FAILED';badge.className='badge bad'}
    toast(firebaseLastError,'err')
  }finally{
    if(b){b.disabled=false;b.textContent='☁️ Check & Sync Database'}
    if($('#adminBox')){const msg=$('#dbStatus');if(msg&&firebaseLastError){let box=$('#dbErrorText');if(!box){box=document.createElement('div');box.id='dbErrorText';box.className='notice err';msg.parentNode.parentNode.appendChild(box)}box.textContent='Last error: '+firebaseLastError}}
  }
}

  function calc(){
    let o=svc.options[svc.selectedIndex];if(!o)return;
    qty.min=o.dataset.min;qty.max=o.dataset.max;

    if(!link)return toast('Link required','err');
    let charge=round4(num(sv.rate)*q/1000),wall=walletOf(user);

    user.balance=round4(num(user.balance)-charge);user.spent=round4(num(user.spent)+charge);
    let order={id:newId(),userId:user.id,service:sv.name,cat:sv.cat,link:link,qty:q,charge:charge,status:'Pending',remains:q,refunded:0,date:now()};
    state.orders.push(order);
    pushTxn(user.id,'Debit',-charge,'Order #'+order.id+' • '+sv.name);
    sessionStorage.removeItem('pick');save();toast('Order placed');
    adminNotify('order',{username:user.uid,id:order.id,service:sv.name,link:link,qty:q,charge:charge,balance:walletOf(user).balance});

  }

function submitDeposit(e){
  e.preventDefault();
  let u=me();if(!u)return;
  let f=new FormData(e.target),p=state.settings.payment||{},min=Math.max(1,num(p.minFund,10));
  let amount=round4(num(f.get('amount'))),ref=String(f.get('ref')||'').trim();
  if(!(amount>0))return toast('Enter a valid amount','err');
  if(amount<min)return toast('Minimum deposit is '+money(min),'err');
  if(amount>200000)return toast('Ek request me max '+money(200000)+' — badi amount ke liye support ko batao','err');
  if(ref.length<4)return toast('UTR / reference kam se kam 4 characters ka ho','err');
  if((state.funds||[]).some(x=>String(x.userId)===String(u.id)&&x.status==='Pending'&&String(x.ref||'').toLowerCase()===ref.toLowerCase()))return toast('Ye UTR pehle se submit ho chuka hai','err');
  state.funds.push({id:newId(),userId:u.id,user:u.uid,amount:amount,method:String(f.get('method')||'UPI'),ref:ref,proof:String(f.get('proof')||''),status:'Pending',date:now()});
  save();toast('Deposit request submitted — verification pending');
  adminNotify('fund',{username:u.uid,email:u.email,mobile:u.mobile,amount:amount,method:String(f.get('method')||'UPI'),ref:ref});
  fundsPage('deposit')
}
function requestWithdraw(e){
  e.preventDefault();
  let u=me();if(!u)return;
  let wc=wcfg();if(!wc.enabled)return toast('Withdrawals are temporarily closed','err');
  let f=new FormData(e.target),amount=round4(num(f.get('amount'))),method=String(f.get('method')||wc.methods[0]),detail=String(f.get('detail')||'').trim(),note=String(f.get('note')||'').trim();
  let w=walletOf(u);
  if(!(amount>0))return toast('Enter a valid amount','err');
  if(amount<wc.min)return toast('Minimum payout is '+money(wc.min),'err');
  if(wc.max>0&&amount>wc.max)return toast('Maximum payout per request is '+money(wc.max),'err');
  if(amount>w.available)return toast('Available balance '+money(w.available)+' se zyada nahi','err');
  if(!detailOK(method,detail))return toast(method==='Bank Transfer'?'Sahi account number (9+ digits) daalo':'Sahi UPI ID (name@bank) ya 10-digit number daalo','err');
  let dup=withdrawalsOf(u.id).find(x=>x.status===WD.PENDING&&String(x.detail||'').toLowerCase()===detail.toLowerCase()&&round4(num(x.amount))===amount);
  if(dup)return toast('Same amount + detail ki request already pending (#'+dup.id+')','err');
  let fee=feeOf(amount,wc.fee),net=round4(Math.max(0,amount-fee));
  let rec={id:nextWdId(),userId:u.id,user:u.uid,amount:amount,fee:fee,net:net,method:method,detail:detail,note:note,status:WD.PENDING,date:now(),adminNote:'',ref:''};
  (state.withdrawals||(state.withdrawals=[])).push(rec);
  u.balance=round4(Math.max(0,w.balance-amount));u.held=round4(num(u.held)+amount);
  pushTxn(u.id,'Hold',-amount,'Payout request #'+rec.id+' held');
  save();toast('Payout request #'+rec.id+' bhej diya — '+money(amount)+' hold par');
  adminNotify('withdraw',{username:u.uid,email:u.email,mobile:u.mobile,amount:amount,fee:fee,net:net,method:method,detail:detail,note:note,ref:rec.id,balance:walletOf(u).balance});
  fundsPage('withdraw')
}
function detailOK(method,detail){
  const s=String(detail||'').trim();
  if(s.length<6)return false;
  if(method==='Bank Transfer')return /\d{9,}/.test(s.replace(/[\s-]/g,''));
  if(/paytm/i.test(method))return /\d{10}/.test(s.replace(/\D/g,''))||/^[\w.\-]+@[\w.\-]+$/.test(s);
  return /^[\w.\-]+@[a-zA-Z]{2,}$/.test(s)||/^[6-9]\d{9}$/.test(s.replace(/\D/g,''))
}

function exportPayoutCsv(){
  let list=withdrawals().slice().reverse();

  const head=['id','user','userId','amount','fee','net','method','detail','note','status','requestedAt','reviewedAt','payoutRef'];
  const cell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv=[head.join(',')].concat(list.map(w=>head.map(k=>cell(w[k])).join(','))).join('\n');
  try{
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trustedsmm-payouts-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('CSV downloaded')
  }catch(e){console.error(e);toast('Export failed','err')}
}
function allocateServiceId(){
  state.next=state.next||{};
  const reserved=new Set();let highest=0;
  const reserve=value=>{
    if(value==null)return;
    const key=String(value);reserved.add(key);
    const n=Number(key);if(Number.isSafeInteger(n)&&n>highest)highest=n
  };
  (state.services||[]).forEach(s=>reserve(s&&s.id));
  Object.keys((_cloud&&_cloud.services)||{}).forEach(reserve);
  (((state.deleted||{}).services)||[]).forEach(reserve);
  let id=Math.max(1,Math.floor(num(state.next.service,1)),highest+1);
  while(reserved.has(String(id)))id++;
  state.next.service=id+1;
  return id
}

window.wdAct=(id,act)=>{
  if(!requireAdmin())return;
  let w=(state.withdrawals||[]).find(x=>String(x.id)===String(id));
  if(!w)return toast('Payout request not found','err');
  if(w.status!==WD.PENDING)return toast('Request pehle se '+w.status+' hai','err');
  let u=state.users.find(x=>String(x.id)===String(w.userId));
  let amt=round4(Math.max(0,num(w.amount)));
  if(!u){
    if(act!=='reject')return toast('User delete ho chuka hai — pehle Reject karke request close karein','err');
  }
  if(act==='paid'){
    let inp=$('#wref'+w.id),ref=String((inp&&inp.value)||'').trim();
    if(!ref){ref=String(prompt('Payment reference / UTR  →  '+(w.user||'user')+' ko '+money(num(w.net||amt))+':','')||'').trim()}
    if(!ref)return toast('UTR / payment reference daalo (user ko proof chahiye)','err');
    w.status=WD.PAID;w.ref=ref.slice(0,60);w.paidAt=now();w.reviewedAt=now();w.reviewedBy=(me()||{}).uid||'admin';
    if(u){
      u.held=round4(Math.max(0,num(u.held)-amt)); /* reservation khatam — paisa wallet se gaya hi tha */
      u.withdrawn=round4(Math.max(0,num(u.withdrawn)+amt));

    }
    save();toast('Marked PAID — '+money(amt)+' ka payout close ho gaya');
    adminNotify('withdrawPaid',{username:w.user||'-',id:w.id,amount:amt,net:num(w.net||amt),ref:ref,balance:u?walletOf(u).balance:0});
    adminWithdrawals();return
  }
  let why=prompt('Reject reason (user ko dikhega):','Payout detail mismatch — sahi UPI/A/C ke saath dobara request bhejein');
  if(why===null)return;
  w.status=WD.REJECTED;w.adminNote=String(why||'').trim().slice(0,200);w.reviewedAt=now();w.reviewedBy=(me()||{}).uid||'admin';

    u.held=round4(Math.max(0,num(u.held)-amt));

    pushTxn(u.id,'Unhold',amt,'Payout #'+w.id+' rejected — '+money(amt)+' released')
  }
  save();toast('Rejected — '+money(amt)+' wallet me wapas available');
  adminNotify('withdrawRejected',{username:w.user||'-',id:w.id,amount:amt,note:w.adminNote,balance:u?walletOf(u).balance:0});

};

  bl.forEach(b=>pages.push({loc:SITE_URL+'/blog/'+b.slug,last:(b.date||today),pr:0.8,cf:'monthly'}));
  let xml='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
  pages.forEach(p=>{xml+='  <url>\n    <loc>'+p.loc+'</loc>\n    <lastmod>'+p.last+'</lastmod>\n    <changefreq>'+p.cf+'</changefreq>\n    <priority>'+p.pr.toFixed(1)+'</priority>\n  </url>\n'});
  return xml+'</urlset>';
}
function buildRobotsTxt(){return 'User-agent: *\nAllow: /\n\nSitemap: '+SITE_URL+'/sitemap.xml'}
function serveVirtualFile(name){
  try{
    const txt=name==='sitemap.xml'?buildSitemapXml():buildRobotsTxt();
    document.documentElement.innerHTML='';
    document.body.textContent=txt;
    document.title=name;
  }catch(e){console.error(e)}
}
/* pathname-based: jab Render /sitemap.xml ko /index.html par rewrite kare */
(function(){let pn=location.pathname.split('/').pop().toLowerCase();if(pn==='sitemap.xml'||pn==='robots.txt')serveVirtualFile(pn)})();
/* flush any pending cloud write when the tab is closed/hidden (best-effort) */
window.addEventListener('pagehide',()=>{if(cloudWriteTimer){clearTimeout(cloudWriteTimer);cloudWriteTimer=null;syncNow()}});
/* boot app sirf tab, jab virtual file serve nahi ho rahi ho */
(function(){let pn=location.pathname.split('/').pop().toLowerCase();if(!(pn==='sitemap.xml'||pn==='robots.txt')){if(state.currentUser==null){const sk=Number(sessionStorage.getItem(SESSION_KEY))||Number(localStorage.getItem(SESSION_KEY));if(sk){state.currentUser=sk;sessionStorage.setItem(SESSION_KEY,String(sk));localStorage.removeItem(SESSION_KEY)}}renderNav();routePage();loadFirebase()}})();
})();
</script>
<script>
(function(){
  const app=document.getElementById('app');
  if(!app)return;

  // Ambient light layers: purely decorative, no images or libraries required.
  const ambient=document.createElement('div');
  ambient.className='ambient-layer';
  ambient.setAttribute('aria-hidden','true');
  ambient.innerHTML='<span class="ambient-orb orb-a"></span><span class="ambient-orb orb-b"></span><span class="ambient-orb orb-c"></span>';
  document.body.insertBefore(ambient,document.body.firstChild);

  const finePointer=!!(window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches);
  let cursorGlow=null;
  if(finePointer){
    cursorGlow=document.createElement('div');
    cursorGlow.className='cursor-glow';
    cursorGlow.setAttribute('aria-hidden','true');
    document.body.appendChild(cursorGlow);
    let frame=0,lastX=0,lastY=0;
    document.addEventListener('pointermove',function(e){
      lastX=e.clientX;lastY=e.clientY;
      if(frame)return;
      frame=requestAnimationFrame(function(){
        cursorGlow.style.left=lastX+'px';
        cursorGlow.style.top=lastY+'px';
        frame=0;
      });
    },{passive:true});
  }

  let revealObserver=null;
  if('IntersectionObserver' in window){
    revealObserver=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    },{threshold:.06,rootMargin:'0px 0px -5% 0px'});
  }

  function enhance(){
    const tiltNodes=app.querySelectorAll('.service,.platform-card,.postCard,.home-login-card,.heroBox,.adminStat,.stat');
    tiltNodes.forEach(function(el){el.classList.add('tilt-card')});
    if(!revealObserver){
      app.querySelectorAll('.reveal').forEach(function(el){el.classList.add('is-visible')});
      return;
    }
    const revealNodes=app.querySelectorAll('.card,.heroBox,.platform-card,.postCard,.blogHeroCard,.featureStory,.head,.adminHero,.adminCard');
    revealNodes.forEach(function(el,index){
      if(!el.classList.contains('reveal')){
        el.classList.add('reveal');
        el.style.setProperty('--reveal-delay',((index%4)*55)+'ms');
        revealObserver.observe(el);
      }
    });
  }

  if(finePointer){
    app.addEventListener('pointermove',function(e){
      const card=e.target&&e.target.closest?e.target.closest('.tilt-card'):null;
      if(!card||!app.contains(card))return;
      const r=card.getBoundingClientRect();
      if(!r.width||!r.height)return;
      const px=(e.clientX-r.left)/r.width;
      const py=(e.clientY-r.top)/r.height;
      const rx=(.5-py)*8;
      const ry=(px-.5)*10;
      card.style.setProperty('--tilt-x',rx.toFixed(2)+'deg');
      card.style.setProperty('--tilt-y',ry.toFixed(2)+'deg');
    },{passive:true});
    app.addEventListener('pointerout',function(e){
      const card=e.target&&e.target.closest?e.target.closest('.tilt-card'):null;
      if(card&&app.contains(card)&&(!e.relatedTarget||!card.contains(e.relatedTarget))){
        card.style.setProperty('--tilt-x','0deg');
        card.style.setProperty('--tilt-y','0deg');
      }
    },{passive:true});
  }

  enhance();
  if('MutationObserver' in window){
    const observer=new MutationObserver(function(){requestAnimationFrame(enhance)});
    observer.observe(app,{childList:true,subtree:true});
  }
})();

</script>
